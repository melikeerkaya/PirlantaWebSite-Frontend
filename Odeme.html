<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kartlı Ödeme Sayfası</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #f4f4f4 0%, #fff 100%);
      font-family: 'Poppins', sans-serif;
    }
    .payment-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 30px;
    }
    .credit-card {
      position: relative;
      width: 100%;
      height: 220px;
      border-radius: 16px;
      background: linear-gradient(135deg, #5c6bc0, #3949ab);
      color: white;
      padding: 25px;
      margin-bottom: 30px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    .chip {
      width: 60px;
      height: 40px;
      background: gold;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .card-number,
    .card-holder,
    .card-expiry {
      letter-spacing: 2px;
      font-weight: 500;
      transition: 0.3s;
      white-space: nowrap;
    }
    .card-number {
      font-size: 1.3rem;
      margin-bottom: 15px;
    }
    .card-holder-label,
    .card-expiry-label {
      font-size: 0.75rem;
      opacity: 0.8;
    }
    .btn-pay {
      background: linear-gradient(135deg, #5c6bc0, #3949ab);
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      color: white;
      font-weight: 600;
      transition: 0.3s;
    }
    .btn-pay:hover {
      background: linear-gradient(135deg, #3949ab, #1a237e);
    }
    .card-input {
      border-radius: 10px;
      border: 1px solid #ddd;
      padding: 12px;
      font-size: 15px;
    }
    .fade-text {
      transition: all 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="payment-card">
          <div class="credit-card">
            <div class="chip"></div>
            <div class="card-number fade-text" id="card-number-display">#### #### #### ####</div>
            <div class="d-flex justify-content-between">
              <div>
                <div class="card-holder-label">KART SAHİBİ</div>
                <div class="card-holder fade-text" id="card-holder-display">AD SOYAD</div>
              </div>
              <div>
                <div class="card-expiry-label">SON KULLANMA</div>
                <div class="card-expiry fade-text" id="card-expiry-display">MM/YY</div>
              </div>
            </div>
          </div>

          <form id="payment-form">
            <div class="mb-3">
              <label class="form-label">Kart Numarası</label>
              <input type="text" id="card-number" class="form-control card-input" placeholder="XXXX XXXX XXXX XXXX" maxlength="19" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Kart Üzerindeki İsim</label>
              <input type="text" id="card-holder" class="form-control card-input" placeholder="Ad Soyad" required>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Son Kullanma Tarihi</label>
                <input type="text" id="card-expiry" class="form-control card-input" placeholder="AA/YY" maxlength="5" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">CVV</label>
                <input type="text" class="form-control card-input" placeholder="XXX" maxlength="3" required>
              </div>
            </div>
            <button type="submit" class="btn-pay w-100 mt-3">Ödemeyi Tamamla</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    const numberInput = document.getElementById("card-number");
    const holderInput = document.getElementById("card-holder");
    const expiryInput = document.getElementById("card-expiry");

    const numberDisplay = document.getElementById("card-number-display");
    const holderDisplay = document.getElementById("card-holder-display");
    const expiryDisplay = document.getElementById("card-expiry-display");

    numberInput.addEventListener("input", (e) => {
      let value = e.target.value.replace(/\D/g, "").replace(/(.{4})/g, "$1 ").trim();
      numberInput.value = value;
      numberDisplay.textContent = value || "#### #### #### ####";
      animate(numberDisplay);
    });

    holderInput.addEventListener("input", (e) => {
      holderDisplay.textContent = e.target.value.toUpperCase() || "AD SOYAD";
      animate(holderDisplay);
    });

    expiryInput.addEventListener("input", (e) => {
      let value = e.target.value.replace(/[^0-9]/g, "");
      if (value.length > 2) value = value.slice(0, 2) + "/" + value.slice(2, 4);
      expiryInput.value = value;
      expiryDisplay.textContent = value || "MM/YY";
      animate(expiryDisplay);
    });

    function animate(el) {
      el.style.opacity = "0.6";
      setTimeout(() => el.style.opacity = "1", 200);
    }
  </script>
</body>
</html>
