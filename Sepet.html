<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Sepetim</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-light">
  <div class="container py-5">
    <h2 class="mb-4 text-center fw-bold">🛍️ Sepetim</h2>

    <!-- Sepet içeriği -->
    <div id="cartContainer" class="bg-white p-4 rounded shadow-sm"></div>

    <!-- Toplam ve butonlar -->
    <div class="d-flex justify-content-between align-items-center mt-4">
      <h4>Toplam: <span id="totalAmount">0 TL</span></h4>
      <div class="d-flex gap-2">
        <button id="checkoutBtn" class="btn btn-success px-4 fw-semibold">💳 Sepeti Onayla</button>
        <button id="clearCartBtn" class="btn btn-outline-danger px-4">🗑️ Sepeti Temizle</button>
      </div>
    </div>
  </div>

  <script>
  // ✅ Sepet işlemleri (sadece bu script kalacak)
  function getCart() {
    try { return JSON.parse(localStorage.getItem("cart")) || []; }
    catch { return []; }
  }

  function saveCart(cart) {
    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart();
  }

  function renderCart() {
    const cart = getCart();
    const container = document.getElementById("cartContainer");
    const totalEl = document.getElementById("totalAmount");
    if (!container || !totalEl) return;

    if (cart.length === 0) {
      container.innerHTML = `
        <div class="text-center text-muted py-5">
          <i class="bi bi-cart-x display-5 d-block mb-2"></i>
          <h5>Sepetiniz boş.</h5>
        </div>`;
      totalEl.textContent = "0 TL";
      return;
    }

    let total = 0;
    container.innerHTML = cart.map((p, i) => {
      const price = Number(p.price) || 0;
      const quantity = p.quantity || 1;
      const line = price * quantity;
      total += line;
      return `
        <div class="d-flex align-items-center justify-content-between border-bottom py-3">
          <div class="d-flex align-items-center">
            <img src="${p.image}" width="70" height="70" class="rounded me-3" style="object-fit:cover;">
            <div>
              <strong>${p.title}</strong><br>
              <small class="text-muted">${price.toLocaleString("tr-TR")} TL</small>
            </div>
          </div>
          <div class="d-flex align-items-center">
            <button class="btn btn-outline-secondary btn-sm" onclick="changeQty(${i}, -1)">-</button>
            <span class="mx-2">${quantity}</span>
            <button class="btn btn-outline-secondary btn-sm" onclick="changeQty(${i}, 1)">+</button>
          </div>
          <div class="d-flex align-items-center gap-3">
            <strong>${line.toLocaleString("tr-TR")} TL</strong>
            <button class="btn btn-danger btn-sm" onclick="removeItem(${i})">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>`;
    }).join("");

    totalEl.textContent = `${total.toLocaleString("tr-TR")} TL`;
  }

  function changeQty(index, delta) {
    const cart = getCart();
    cart[index].quantity = Math.max(1, (cart[index].quantity || 1) + delta);
    saveCart(cart);
  }

  function removeItem(index) {
    const cart = getCart();
    cart.splice(index, 1);
    saveCart(cart);
  }

  function clearCart() {
    localStorage.removeItem("cart");
    renderCart();
  }

  document.addEventListener("DOMContentLoaded", () => {
    renderCart();
    document.getElementById("checkoutBtn").addEventListener("click", () => {
      const cart = getCart();
      if (!cart.length) return alert("Sepetiniz boş!");
      window.location.href = "Odeme.html";
    });
    document.getElementById("clearCartBtn").addEventListener("click", clearCart);
  });

    document.addEventListener("DOMContentLoaded", () => {
    renderCart?.();       // Eğer renderCart fonksiyonu varsa çalıştır
    updateCartCount();    // Navbar’daki sayıyı güncelle
  });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
