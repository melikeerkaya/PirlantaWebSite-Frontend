<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Giriş Yap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-4">
        <h3 class="mb-4 text-center">Giriş Yap</h3>
        <form id="loginForm" class="card card-body shadow-sm">
          <div class="mb-3">
            <label class="form-label">E-posta</label>
            <input type="email" id="email" class="form-control" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Şifre</label>
            <input type="password" id="password" class="form-control" required minlength="6" />
          </div>
          <button class="btn btn-dark w-100" type="submit">Giriş Yap</button>
          <p class="text-center mt-3 mb-0">
            Hesabın yok mu? <a href="register.html">Kayıt ol</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:5000";

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          alert(data.error || "Giriş başarısız. E-posta veya şifre hatalı.");
          return;
        }

        // Token'ı kaydet
        localStorage.setItem("token", data.token);
        alert("Giriş başarılı!");
        window.location.href = "anasayfa.html"; // giriş sonrası yönlendirme
      } catch (err) {
        alert("Ağ hatası: " + err.message);
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/scripts.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
