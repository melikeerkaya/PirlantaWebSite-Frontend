<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Kayıt Ol</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-4">
        <h3 class="mb-4 text-center">Kayıt Ol</h3>
        <form id="registerForm" class="card card-body shadow-sm">
          <div class="mb-3">
            <label class="form-label">Ad Soyad</label>
            <input type="text" id="name" class="form-control" required />
          </div>
          <div class="mb-3">
            <label class="form-label">E-posta</label>
            <input type="email" id="email" class="form-control" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Şifre</label>
            <input type="password" id="password" class="form-control" required minlength="6" />
          </div>
          <button class="btn btn-dark w-100" type="submit">Kayıt Ol</button>
          <p class="text-center mt-3 mb-0">
            Zaten hesabın var mı? <a href="Login.html">Giriş yap</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:5000";
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const res = await fetch(`${API_BASE}/api/auth/register`, {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();

        if (!res.ok) { alert(data.error || "Kayıt başarısız"); return; }

        alert("Kayıt başarılı! Şimdi giriş yapın.");
        window.location.href = "Login.html"; // ← düzeltildi
      } catch (err) {
        alert("Ağ hatası: " + err.message);
      }
    });
  </script>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/scripts.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>

</body>
</html>
